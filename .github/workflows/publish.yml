# Publish to npm on version tags — auth via npm Trusted Publishing (OIDC), no NPM_TOKEN.
name: Publish to npm
on:
  push:
    tags:
      - "fork/v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports trusted publishing (>= 11.5)
        run: npm install -g npm@latest
      - name: Assert tag matches package.json version
        run: |
          node -e "const v=require('./package.json').version; const tag=process.env.GITHUB_REF_NAME.replace(/^fork\\//, ''); if (tag !== 'v'+v) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json version v' + v); process.exit(1); }"
      - uses: jdx/mise-action@v2
      - run: mise run typecheck
      - run: mise run test
      - run: npm publish --ignore-scripts=false
